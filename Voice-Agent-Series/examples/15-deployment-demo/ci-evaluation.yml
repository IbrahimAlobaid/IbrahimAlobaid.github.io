# Example workflow. Copy to YOUR repository's .github/workflows/ after reviewing.
name: voice-agent-eval-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # In production pin a reviewed immutable commit SHA.
      - uses: actions/setup-python@v5 # In production pin a reviewed immutable commit SHA.
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s examples -p 'test_voice_eval_observability_lab.py' -v
      - name: Synthetic release gate
        run: python examples/voice_eval_observability_lab.py --group baseline
      - name: Build isolated diagnostics demo
        run: docker build -t voice-diagnostics-demo:ci examples/15-deployment-demo
